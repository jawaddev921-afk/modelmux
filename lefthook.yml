colors: false

output:
  - summary
  - failure

pre-commit:
  # Skip the entire hook in CI — GitHub Actions runs each check independently
  # in dedicated workflow steps, making the hook redundant and harmful
  # (failed hook = create_pull_request retries with a new branch each time).
  skip:
    - CI: 'true'

  commands:
    # --- Format staged files in-place and re-stage --------------------------
    # `bun fmt --staged` formats only staged files and re-stages them, which
    # replaces both the old biome-format and biome-lint hook commands.
    fmt:
      run: bun fmt --staged

    # --- TypeScript type-check across all packages ---------------------------
    typecheck:
      run: bun run typecheck

    # --- Frontend build (catches broken imports/exports) ---------------------
    frontend-build:
      glob: 'packages/frontend/src/**'
      run: bun run build:frontend

    # --- OpenAPI spec lint (only when OpenAPI docs change) -----------------
    openapi-lint:
      glob: 'docs/openapi/**'
      run: bun run lint:openapi

    # --- Backend tests (only when backend source changes) --------------------
    backend-tests:
      glob: 'packages/backend/src/**'
      run: bun test --parallel --changed=HEAD
